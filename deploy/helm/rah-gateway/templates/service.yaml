apiVersion: v1
kind: Service
metadata:
  name: {{ include "rah-gateway.fullname" . }}
  labels:
    {{- include "rah-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.dataPlanePort }}
      targetPort: data
      protocol: TCP
      name: data
    - port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "rah-gateway.selectorLabels" . | nindent 4 }}
