# RAH Gateway — local Docker Compose configuration
# Mounted read-only at /app/gateway.yaml inside the container.
#
# Redis is running in Docker — use host.docker.internal to reach host-exposed
# ports from inside a container (works on Docker Desktop for Windows/Mac).
# If Redis is on a named Docker network, use its container name instead.
#
# PostgreSQL: replace the DSN below with your actual connection string.

datastore:
  stores:
    redis_primary:
      name: redis_primary
      kind: redis
      enabled: true
      connection:
        # host.docker.internal resolves to the host machine from inside Docker Desktop.
        # Use this if your Redis container exposes port 6379 on the host.
        # If Redis is on the same Docker network, use its container name (e.g. "redis:6379").
        address: "host.docker.internal:6379"
        pool_size: 16

    postgres_primary:
      name: postgres_primary
      kind: postgresql
      enabled: true
      connection:
        # Replace with your actual Postgres DSN.
        # host.docker.internal reaches the host machine from inside Docker Desktop.
        address: "postgres://postgres:2hi2@HI@@host.docker.internal:5432/gateway?sslmode=disable"

  bindings:
    api_definitions: "postgres_primary"
    flows:           "postgres_primary"
    tenant_data:     "postgres_primary"
    rate_limit:      "postgres_primary"
    customer_data:   "postgres_primary"
    instances:       "postgres_primary"
    credentials:     "postgres_primary"
    async_jobs:      "postgres_primary"
    ai_config:       "postgres_primary"
    mcp_tools:       "postgres_primary"
    obs_access_log:  "postgres_primary"
    obs_metrics:     "postgres_primary"
    obs_traces:      "postgres_primary"
    cache:           "redis_primary"

cache:
  mem_budget_mb: 64
  tenant_limit_mb: 8
  backend:
    kind: memory

server:
  port: 8080
  management_port: 8081
  read_timeout_ms: 30000
  write_timeout_ms: 30000

observability:
  # Optional full prompt/response JSONL detail log:
  # set env var on container, e.g.
  #   RAH_OBS_DETAIL_LOG_FILE=/app/logs/obs-detail.jsonl
  traces:
    enabled: true
    sample_rate: 1.0          # capture every request
    always_trace_5xx: true
    instruction_timing: true  # per-instruction durations in trace view

# No ingest log sink in Docker — container logs go to stdout/stderr.
# Use: docker compose logs -f gateway
# (File log sink is configured in gateway.yaml for local direct runs.)
