name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute lint args
        id: lint_args
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Push to main: only check the newly merged commits
            echo "args=--new-from-rev=${{ github.event.before }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: only check changes vs base branch
            echo "args=--new-from-rev=origin/main" >> $GITHUB_OUTPUT
          else
            # Feature branch push: full scan, must be clean
            echo "args=" >> $GITHUB_OUTPUT
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: ${{ steps.lint_args.outputs.args }}

  # ── Build (verify it compiles on all target platforms) ────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build rah-gateway
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o /dev/null ./cmd/rah-gateway/

      - name: Build rah-studio
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o /dev/null ./cmd/rah-studio/

  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

          set +e
          OUTPUT=$(govulncheck ./... 2>&1)
          SCAN_EXIT=$?
          set -e
          echo "$OUTPUT"

          # Exit code 1 with a network error means the vuln DB was unreachable — treat as warning.
          if [ "$SCAN_EXIT" -eq 1 ] && echo "$OUTPUT" | grep -q "fetching vulnerabilities"; then
            echo "::warning::govulncheck could not reach vuln.go.dev (network error) -- skipping vulnerability scan"
            exit 0
          fi

          if [ "$SCAN_EXIT" -ne 3 ]; then exit "$SCAN_EXIT"; fi

          # Modules whose go.mod line was added or version-bumped in this PR.
          git fetch origin main --quiet
          CHANGED=$(git diff origin/main -- go.mod | grep "^+" | grep -v "^+++" | grep -oE '[a-zA-Z0-9][a-zA-Z0-9._/-]+/[a-zA-Z0-9._/-]+' | sort -u)

          HAS_ERROR=0
          while IFS= read -r module; do
            FIXED=$(echo "$OUTPUT" | grep -A4 "Module: $module" | grep "Fixed in:" | head -1)
            if echo "$FIXED" | grep -qv "Fixed in: N/A"; then
              echo "::error::$module has a vulnerability with a fix available — upgrade"
              HAS_ERROR=1
            elif echo "$CHANGED" | grep -qF "$module"; then
              echo "::error::$module was added or upgraded in this PR and has an unfixable vulnerability — review required"
              HAS_ERROR=1
            else
              echo "::warning::$module has an unfixable vulnerability (pre-existing) — monitoring"
            fi
          done <<< "$(echo "$OUTPUT" | grep "Module:" | awk '{print $2}' | sort -u)"

          exit "$HAS_ERROR"

      # Run tests; skip known pre-existing failures (observability, inlcache benchmarks)
      - name: Run tests
        run: |
          go test \
            -timeout 120s \
            -skip "TestHighTPSWithEviction|TestVsModels|TestMemoryVsOldIndex|TestSchemaAndUIServed|TestUnifiedSyncRegistersApiAndRuntimeConsumesCompiledFlow" \
            ./internal/... \
            ./cmd/...
        env:
          REDIS_ADDR: localhost:6379
          RAH_TEST_PG_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=gateway sslmode=disable"

  # ── Docker build check (no push) ──────────────────────────────────────────
  docker-check:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: rah-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
