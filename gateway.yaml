# RAH Gateway Configuration
# Start with: go run ./cmd/rah-gateway -config gateway.yaml

datastore:
  stores:
    # ── Redis (hot-path / ephemeral) ──────────────────────────────────────────
    redis_primary:
      name: redis_primary
      kind: redis
      enabled: true
      connection:
        # Option A — single address string (host:port)
        address: "localhost:6379"
        pool_size: 32
        # Option B — explicit host + port (alternative to address)
        # host: "localhost"
        # port: 6379
        # Option C — credentials via secrets manager (env:, enc:, vault:, awssm:, gsm:)
        # username_ref: "env:REDIS_USER"
        # password_ref: "env:REDIS_PASS"
        # Or inline plaintext (dev only):
        # password: "mysecret"

    # ── PostgreSQL (persistent / control-plane) ───────────────────────────────
    postgres_primary:
      name: postgres_primary
      kind: postgresql
      enabled: true
      connection:
        # Option A — full DSN (recommended for production; credentials embedded in URL)
        address: "postgres://postgres:2hi2@HI@@localhost:5432/gateway?sslmode=disable"
        # Option B — explicit fields + secret refs (recommended for secrets management)
        # host: "localhost"
        # port: 5432
        # database: "gateway"
        # username_ref: "env:PG_USER"          # resolves $PG_USER at startup
        # password_ref: "env:PG_PASS"          # resolves $PG_PASS at startup
        # password_ref: "enc:base64ciphertext"  # AES-256-GCM encrypted (needs secrets.encrypted)
        # password_ref: "vault://secret/pg#password"  # HashiCorp Vault
        # password_ref: "awssm://my/secret"    # AWS Secrets Manager
        # password_ref: "gsm://projects/p/secrets/s/versions/latest"  # Google Secret Manager

  # Logical domain → store binding
  # Required: api_definitions, flows, tenant_data, cache
  bindings:
    api_definitions: "postgres_primary"   # compiled API + path definitions
    flows:           "postgres_primary"   # compiled instruction sets
    tenant_data:     "postgres_primary"   # aliases, service URLs, identifiers
    rate_limit:      "postgres_primary"   # named rate limit configs + counters
    customer_data:   "postgres_primary"   # arbitrary per-tenant data
    instances:       "postgres_primary"   # live gateway instance registry
    credentials:     "postgres_primary"   # credential mappings
    async_jobs:      "postgres_primary"   # async job state
    ai_config:       "postgres_primary"   # LLM model catalog + MCP registry
    mcp_tools:       "postgres_primary"   # virtual MCP server definitions
    obs_access_log:  "postgres_primary"   # persisted access logs (Postgres/Timescale)
    obs_metrics:     "postgres_primary"   # persisted metric snapshots
    obs_traces:      "postgres_primary"   # persisted request traces
    cache:           "redis_primary"      # request-level response cache (hot path)

ingest:
  enabled: true
  sinks:
    - name: log_file
      kind: file
      format: raw           # write log lines verbatim (no JSON wrapping)
      file_path: ./gateway.log
      file_buf_kb: 64
      flush_ms: 1000        # flush to disk every second
  kinds:
    - kind: log
      ring_size: 4096
      allow_drop: true      # never block a request thread for a log write
      priority: 1
      sinks: [log_file]

observability:
  # Optional: enable full JSONL prompt/response detail log via environment variable
  #   RAH_OBS_DETAIL_LOG_FILE=./obs-detail.jsonl
  # This is env-driven (not a YAML key) to keep sensitive payload logging explicit.
  store:
    # use PostgreSQL-compatible backend (works with TimescaleDB)
    type: postgres
    max_traces: 500000
  traces:
    enabled: true
    sample_rate: 1.0
    always_trace_5xx: true
    instruction_timing: true
  access_log:
    enabled: true
    sample_rate: 1.0
  info_log:
    enabled: true
    fields: [api_id, tenant_id, status, duration_ns, upstream_duration_ns]
