# RAH Gateway Configuration
# Start with: go run ./cmd/rah-gateway -config gateway.yaml

datastore:
  stores:
    # ── Redis (hot-path / ephemeral) ──────────────────────────────────────────
    redis_primary:
      name: redis_primary
      kind: redis
      enabled: true
      connection:
        # Option A — single address string (host:port)
        address: "localhost:6379"
        pool_size: 32
        # Option B — explicit host + port (alternative to address)
        # host: "localhost"
        # port: 6379
        # Option C — credentials via secrets manager (env:, enc:, vault:, awssm:, gsm:)
        # username_ref: "env:REDIS_USER"
        # password_ref: "env:REDIS_PASS"
        # Or inline plaintext (dev only):
        # password: "mysecret"

    # ── PostgreSQL (persistent / control-plane) ───────────────────────────────
    postgres_primary:
      name: postgres_primary
      kind: postgresql
      enabled: true
      connection:
        # Option A — full DSN (recommended for production; credentials embedded in URL)
        address: "postgres://postgres:2hi2@HI@@localhost:5432/gateway?sslmode=disable"
        # Option B — explicit fields + secret refs (recommended for secrets management)
        # host: "localhost"
        # port: 5432
        # database: "gateway"
        # username_ref: "env:PG_USER"          # resolves $PG_USER at startup
        # password_ref: "env:PG_PASS"          # resolves $PG_PASS at startup
        # password_ref: "enc:base64ciphertext"  # AES-256-GCM encrypted (needs secrets.encrypted)
        # password_ref: "vault://secret/pg#password"  # HashiCorp Vault
        # password_ref: "awssm://my/secret"    # AWS Secrets Manager
        # password_ref: "gsm://projects/p/secrets/s/versions/latest"  # Google Secret Manager

  # Logical domain → store binding
  # Required: api_definitions, flows, tenant_data, cache
  bindings:
    api_definitions: "postgres_primary"   # compiled API + path definitions
    flows:           "postgres_primary"   # compiled instruction sets
    tenant_data:     "postgres_primary"   # aliases, service URLs, identifiers
    rate_limit:      "postgres_primary"   # named rate limit configs + counters
    customer_data:   "postgres_primary"   # arbitrary per-tenant data
    instances:       "postgres_primary"   # live gateway instance registry
    credentials:     "postgres_primary"   # credential mappings
    async_jobs:      "postgres_primary"   # async job state
    ai_config:       "postgres_primary"   # LLM model catalog + MCP registry
    mcp_tools:       "postgres_primary"   # virtual MCP server definitions
    obs_access_log:  "postgres_primary"   # persisted access logs (Postgres/Timescale)
    obs_metrics:     "postgres_primary"   # persisted metric snapshots
    obs_traces:      "postgres_primary"   # persisted request traces
    cache:           "redis_primary"      # request-level response cache (hot path)

ingest:
  enabled: true
  sinks:
    - name: log_file
      kind: file
      format: raw           # write log lines verbatim (no JSON wrapping)
      file_path: ./gateway.log
      file_buf_kb: 64
      flush_ms: 1000        # flush to disk every second

    # ── Cross-instance sync sink ──────────────────────────────────────────────
    # Publishes registry mutations (db_put / db_delete) and cache invalidations
    # to a shared Redis Stream so all other RAH instances converge immediately.
    # Uses the same redis_primary store already defined above — no extra Redis
    # connection needed.  Each event is a tiny NDJSON line; the stream is
    # auto-trimmed to the last 100 k entries (~hours of headroom at high write rates).
    # Remove this sink (and the kinds below) to run in single-instance mode with
    # zero overhead — the NumSinksForKind guard short-circuits before any allocation.
    - name: sync_stream
      kind: redis_stream
      dsn: "redis://localhost:6379"   # match redis_primary connection above
      stream_name: "rah:sync"         # all instances must use the same stream name
      max_len: 100000                 # XADD MAXLEN ~: keeps stream bounded
      format: ndjson
      flush_ms: 50                    # low latency — flush within 50 ms at most
      max_batch_items: 64             # coalesce burst writes into one XADD
      min_workers: 1
      max_workers: 2

  kinds:
    - kind: log
      ring_size: 4096
      allow_drop: true      # never block a request thread for a log write
      priority: 1
      sinks: [log_file]

    # Registry mutations — tenant upsert/delete/alias, rate limit configs.
    # Ring size is small: registry writes are infrequent management-plane ops.
    # allow_drop: false so a burst of tenant onboarding never silently loses events.
    - kind: db_put
      ring_size: 4096
      allow_drop: false
      priority: 5
      sinks: [sync_stream]

    - kind: db_delete
      ring_size: 4096
      allow_drop: false
      priority: 5
      sinks: [sync_stream]

    # Cache invalidations — emitted after every successful cache_put or cache_delete.
    # Higher ring: cache writes can burst heavily under load.
    # allow_drop: true — a dropped invalidation means a stale L1 hit on another instance
    # for at most one TTL cycle, which is acceptable vs blocking a request goroutine.
    - kind: cache_invalidate
      ring_size: 65536
      allow_drop: true      # prefer drop over blocking the request path
      priority: 10
      sinks: [sync_stream]

  # ── Consumer (read side) ────────────────────────────────────────────────────
  # Each instance also reads the same stream to apply remote changes locally.
  # lastID starts at "$" on startup — only events produced after boot are consumed;
  # state at startup is always restored from the persistent datastore (Postgres).
  # The instance fingerprint guard in main.go skips events this instance emitted,
  # so there is no write→emit→consume→write cascade loop.
  sources:
    - kind: redis_stream
      dsn: "redis://localhost:6379"   # same Redis as the sink above
      stream_name: "rah:sync"         # must match sink stream_name
      timeout_ms: 5000                # XREAD BLOCK timeout; loops back on nil
      events: [db_put, db_delete, cache_invalidate]  # filter: ignore unrelated kinds

observability:
  # Optional: enable full JSONL prompt/response detail log via environment variable
  #   RAH_OBS_DETAIL_LOG_FILE=./obs-detail.jsonl
  # This is env-driven (not a YAML key) to keep sensitive payload logging explicit.
  store:
    # use PostgreSQL-compatible backend (works with TimescaleDB)
    type: postgres
    max_traces: 500000
  traces:
    enabled: true
    sample_rate: 1.0
    always_trace_5xx: true
    instruction_timing: true
  access_log:
    enabled: true
    sample_rate: 1.0
  info_log:
    enabled: true
    fields: [api_id, tenant_id, status, duration_ns, upstream_duration_ns]
