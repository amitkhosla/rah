# ─── Tenant Routing APIs ──────────────────────────────────────────────────────
#
# API definitions and rate limit configs for the tenant routing samples.
# Flows referenced here are defined in instructions/05-tenant-routing.yaml.
# The rl-per-tenant config is also used by apis/06-service-discovery.yaml.
# ─────────────────────────────────────────────────────────────────────────────

rate_limit_configs_v2:

  - name: rl-per-tenant
    enforcement: approximate
    windows:
      - period: 1m
        limit: 100
      - period: 1h
        limit: 1000

  - name: rl-overall
    enforcement: approximate
    windows:
      - period: 1m
        limit: 5000

# ─────────────────────────────────────────────────────────────────────────────
apis:

  # curl -H "X-Tenant-ID: acme" http://localhost:8080/samples/cs/tenant/header
  - name: sample-cs-tenant-header
    path: /samples/cs/tenant/header
    method: GET
    flow_name: api_tenant_from_header
    action: upsert
    skip_rate_limit: true

  # curl "http://localhost:8080/samples/cs/tenant/query?tenant_id=acme"
  - name: sample-cs-tenant-query
    path: /samples/cs/tenant/query
    method: GET
    flow_name: api_tenant_from_query
    action: upsert
    skip_rate_limit: true

  # curl http://localhost:8080/samples/cs/tenant/acme/data
  - name: sample-cs-tenant-path
    path: /samples/cs/tenant
    flow_name: api_tenant_from_path
    action: upsert
    skip_rate_limit: true
    endpoint_configs:
      - path: /{alias}/data
        method: GET

  # Layered rate limits: per-tenant (in flow) + global (on API)
  - name: sample-cs-tenant-rl
    path: /samples/cs/tenant/limited
    method: GET
    flow_name: api_tenant_with_rate_limits
    action: upsert
    rate_limit_policies:
      - kind: named
        config: rl-overall
        count_by: global
    skip_rate_limit: true     # per-tenant enforced in-flow
