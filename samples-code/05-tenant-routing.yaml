# ─── Tenant Routing Samples — Code Style ─────────────────────────────────────
#
# Three tenant identification patterns + one layered rate-limit variant.
# The building-block approach makes the common "identify → resolve → proxy"
# sequence obvious:
#
#   api_tenant_from_header:
#     call identify_tenant_from_header   # header → registry → TenantID
#     call resolve_tenant_upstream       # load "primary" URL → upstream_url
#     call proxy_to_tenant              # http.get + return
#
#   api_tenant_from_query:
#     call read_tenant_query_param       # ?tenant_id= → tenant_alias
#     call identify_tenant_from_slot     # tenant_alias → registry → TenantID
#     call resolve_tenant_upstream       # reused
#     call proxy_to_tenant              # reused
#
#   api_tenant_from_path:
#     call read_tenant_path_param        # {alias} → tenant_alias
#     call identify_tenant_from_slot     # reused
#     call resolve_tenant_upstream       # reused
#     call proxy_to_tenant              # reused
#
#   api_tenant_with_rate_limits:
#     call identify_tenant_from_header   # reused
#     call enforce_per_tenant_limit      # per-tenant counter
#     call resolve_tenant_upstream       # reused
#     call proxy_to_tenant              # reused
#
# Reuse count: resolve_tenant_upstream and proxy_to_tenant are shared by all
# four variants.  identify_tenant_from_slot is shared by query and path variants.
# ─────────────────────────────────────────────────────────────────────────────

flows:

  # ═══════════════════════════════════════════════════════════════════════════
  # TENANT IDENTIFICATION BLOCKS
  # ═══════════════════════════════════════════════════════════════════════════

  # Identify from X-Tenant-ID header directly
  - name: identify_tenant_from_header
    action: upsert
    code: |
      registry.lookup(header("X-Tenant-ID"))

  # Identify from whatever is already in tenant_alias slot
  # (used after read_tenant_query_param or read_tenant_path_param)
  - name: identify_tenant_from_slot
    action: upsert
    code: |
      registry.lookup(tenant_alias)

  # Read tenant alias from ?tenant_id= query parameter → tenant_alias slot
  - name: read_tenant_query_param
    action: upsert
    code: |
      tenant_alias = query("tenant_id")

  # Read tenant alias from the first path segment {alias} → tenant_alias slot
  - name: read_tenant_path_param
    action: upsert
    code: |
      tenant_alias = path("0")

  # ═══════════════════════════════════════════════════════════════════════════
  # UPSTREAM RESOLUTION & PROXY BLOCKS (shared by all variants)
  # ═══════════════════════════════════════════════════════════════════════════

  # Load the tenant's registered "primary" upstream URL → upstream_url slot
  - name: resolve_tenant_upstream
    action: upsert
    code: |
      upstream_url = registry.url("primary")

  # Proxy to whichever URL is in upstream_url; return the response body
  - name: proxy_to_tenant
    action: upsert
    code: |
      resp_body = http.get(url_var: upstream_url, timeout: 5000)
      return(200, resp_body)

  # ═══════════════════════════════════════════════════════════════════════════
  # RATE LIMIT ENFORCEMENT BLOCK
  # ═══════════════════════════════════════════════════════════════════════════

  # Per-tenant: each tenant gets its own counter
  - name: enforce_per_tenant_limit
    action: upsert
    code: |
      rate_limit_v2(config: "rl-per-tenant", count_by: tenant)

  # ═══════════════════════════════════════════════════════════════════════════
  # ENTRY POINTS  — reads like pseudocode
  # ═══════════════════════════════════════════════════════════════════════════

  - name: api_tenant_from_header
    action: upsert
    code: |
      call identify_tenant_from_header
      call resolve_tenant_upstream
      call proxy_to_tenant

  - name: api_tenant_from_query
    action: upsert
    code: |
      call read_tenant_query_param
      call identify_tenant_from_slot
      call resolve_tenant_upstream
      call proxy_to_tenant

  - name: api_tenant_from_path
    action: upsert
    code: |
      call read_tenant_path_param
      call identify_tenant_from_slot
      call resolve_tenant_upstream
      call proxy_to_tenant

  - name: api_tenant_with_rate_limits
    action: upsert
    code: |
      call identify_tenant_from_header
      call enforce_per_tenant_limit
      call resolve_tenant_upstream
      call proxy_to_tenant

# ─────────────────────────────────────────────────────────────────────────────
rate_limit_configs_v2:

  - name: rl-per-tenant
    enforcement: approximate
    windows:
      - period: 1m
        limit: 100
      - period: 1h
        limit: 1000

  - name: rl-overall
    enforcement: approximate
    windows:
      - period: 1m
        limit: 5000

# ─────────────────────────────────────────────────────────────────────────────
apis:

  # curl -H "X-Tenant-ID: acme" http://localhost:8080/samples/cs/tenant/header
  - name: sample-cs-tenant-header
    path: /samples/cs/tenant/header
    method: GET
    flow_name: api_tenant_from_header
    action: upsert

  # curl "http://localhost:8080/samples/cs/tenant/query?tenant_id=acme"
  - name: sample-cs-tenant-query
    path: /samples/cs/tenant/query
    method: GET
    flow_name: api_tenant_from_query
    action: upsert

  # curl http://localhost:8080/samples/cs/tenant/acme/data
  - name: sample-cs-tenant-path
    path: /samples/cs/tenant/{alias}/data
    method: GET
    flow_name: api_tenant_from_path
    action: upsert

  # Layered rate limits: per-tenant (in flow) + global (on API)
  - name: sample-cs-tenant-rl
    path: /samples/cs/tenant/limited
    method: GET
    flow_name: api_tenant_with_rate_limits
    action: upsert
    rate_limit_policies:
      - kind: named
        config: rl-overall
        count_by: global
    skip_rate_limit: true     # per-tenant enforced in-flow
