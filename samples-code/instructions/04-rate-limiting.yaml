# ─── Rate Limiting Flows ──────────────────────────────────────────────────────
#
# Building-block flows for the rate limiting samples.
# APIs that use these flows are in apis/04-rate-limiting.yaml.
# Rate limit configs referenced here are defined in apis/04-rate-limiting.yaml.
#
# Flow map:
#
#   api_rl_by_ip:
#     call enforce_ip_rate_limit      # check counter keyed by client IP
#     call send_rl_ok
#
#   api_rl_by_header:
#     call read_api_key_header        # bind X-API-Key → api_key_slot
#     call enforce_api_key_rate_limit # check counter keyed by api_key_slot
#     call send_rl_ok
#
# ─────────────────────────────────────────────────────────────────────────────

flows:

  # ═══════════════════════════════════════════════════════════════════════════
  # UTILITIES
  # ═══════════════════════════════════════════════════════════════════════════

  - name: send_rl_ok
    action: upsert
    code: |
      return(200, '{"status":"ok"}')

  # ═══════════════════════════════════════════════════════════════════════════
  # RATE LIMIT ENFORCEMENT BLOCKS
  # ═══════════════════════════════════════════════════════════════════════════

  # A. Per-IP: 10 req/s burst + 100 req/min sustained
  - name: enforce_ip_rate_limit
    action: upsert
    code: |
      rate_limit_v2(config: "rl-by-ip", count_by: ip)

  # B. Per API-key: bind the header first, then check per-key counter
  - name: read_api_key_header
    action: upsert
    code: |
      api_key_slot = header("X-API-Key")

  - name: enforce_api_key_rate_limit
    action: upsert
    code: |
      rate_limit_v2(config: "rl-by-header", count_by: slot, slot: api_key_slot)

  # C. Global: one counter shared across all callers on the endpoint
  - name: enforce_global_rate_limit
    action: upsert
    code: |
      rate_limit_v2(config: "rl-global", count_by: global)

  # D. Multi-window IP limit: all three windows must pass
  - name: enforce_multi_window_ip_limit
    action: upsert
    code: |
      rate_limit_v2(config: "rl-multi-window", count_by: ip)

  # ═══════════════════════════════════════════════════════════════════════════
  # ENTRY POINTS  — reads like pseudocode
  # ═══════════════════════════════════════════════════════════════════════════

  - name: api_rl_by_ip
    action: upsert
    code: |
      call enforce_ip_rate_limit
      call send_rl_ok

  - name: api_rl_by_header
    action: upsert
    code: |
      call read_api_key_header
      call enforce_api_key_rate_limit
      call send_rl_ok

  - name: api_rl_global
    action: upsert
    code: |
      call enforce_global_rate_limit
      call send_rl_ok

  - name: api_rl_multi_window
    action: upsert
    code: |
      call enforce_multi_window_ip_limit
      call send_rl_ok
