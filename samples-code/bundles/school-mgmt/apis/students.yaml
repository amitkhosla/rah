apis:
  - name: school-students-list
    app_name: school-mgmt
    path: /school/students
    method: GET
    flow_name: school_students_list
    rate_limit_config: school-student-rl
    action: upsert

  - name: school-students-get
    app_name: school-mgmt
    path: /school/students/{id}
    method: GET
    flow_name: school_student_get
    rate_limit_config: school-student-rl
    action: upsert

  - name: school-students-create
    app_name: school-mgmt
    path: /school/students
    method: POST
    flow_name: school_student_create
    rate_limit_config: school-admin-rl
    action: upsert

  - name: school-students-update
    app_name: school-mgmt
    path: /school/students/{id}
    method: PUT
    flow_name: school_student_update
    rate_limit_config: school-admin-rl
    action: upsert
