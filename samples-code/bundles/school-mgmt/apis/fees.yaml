apis:
  - name: school-fees-list
    app_name: school-mgmt
    path: /school/fees
    method: GET
    flow_name: school_fees_list
    rate_limit_config: school-student-rl
    action: upsert

  - name: school-fees-record
    app_name: school-mgmt
    path: /school/fees
    method: POST
    flow_name: school_fee_record
    rate_limit_config: school-admin-rl
    action: upsert

  - name: school-fees-outstanding
    app_name: school-mgmt
    path: /school/fees/outstanding
    method: GET
    flow_name: school_fees_outstanding
    rate_limit_config: school-admin-rl
    action: upsert
