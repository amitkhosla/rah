apis:
  - name: school-classes-list
    app_name: school-mgmt
    path: /school/classes
    method: GET
    flow_name: school_classes_list
    rate_limit_config: school-student-rl
    action: upsert

  - name: school-classes-get
    app_name: school-mgmt
    path: /school/classes/{id}
    method: GET
    flow_name: school_class_get
    rate_limit_config: school-student-rl
    action: upsert

  - name: school-classes-create
    app_name: school-mgmt
    path: /school/classes
    method: POST
    flow_name: school_class_create
    rate_limit_config: school-admin-rl
    action: upsert
