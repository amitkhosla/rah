tests:
  - name: "Scenario 5: Create a class returns 201 with class id"
    flow_name: "school_class_create"
    mode: "published"
    call_mode: "real"
    input:
      method: POST
      path: /school/classes
      headers:
        X-API-Key: alpha-admin-sk-change-me
      body: '{"name":"10C Chemistry","subject":"Chemistry"}'
    assertions:
      - type: status
        expected: 201

  - name: "Scenario 6: Get class details returns 200 with class info including teacher assignment"
    flow_name: "school_class_get"
    mode: "published"
    call_mode: "real"
    input:
      method: GET
      path: /school/classes/c1
      headers:
        X-API-Key: alpha-student-sk-change-me
      body: ""
    assertions:
      - type: status
        expected: 200
