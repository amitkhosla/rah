tests:
  - name: "AI tutor answers subject question"
    flow_name: "school_ai_ask"
    mode: "published"
    call_mode: "mock"
    input:
      method: POST
      path: /school/ai/ask
      headers:
        X-API-Key: alpha-student-sk-change-me
      body: '{"subject":"Mathematics","question":"What is the Pythagorean theorem?"}'
    mocks:
      - step_name: llm_call
        status: 200
        body: '{"answer":"The Pythagorean theorem states that in a right triangle, a²+b²=c²."}'
    assertions:
      - type: status
        expected: 200

  - name: "AI tutor requires API key"
    flow_name: "school_ai_ask"
    mode: "published"
    call_mode: "real"
    input:
      method: POST
      path: /school/ai/ask
      body: '{"subject":"Mathematics","question":"What is the Pythagorean theorem?"}'
    assertions:
      - type: status
        expected: 401
