# Local development stack: RAH gateway + Studio
# Redis and PostgreSQL are expected to already be running externally.
# Update deploy/docker/gateway-local.yaml with your actual Redis/PG addresses.
#
# Usage:
#   docker compose up -d              # start gateway
#   docker compose --profile studio up -d  # + Studio UI on :3000
#   docker compose logs -f gateway    # tail gateway logs
#   docker compose down               # stop

services:

  # ── RAH Gateway ───────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rah-gateway:local
    restart: unless-stopped
    ports:
      - "8080:8080"   # Data plane
      - "8081:8081"   # Management plane
    volumes:
      - ./deploy/docker/gateway-local.yaml:/app/gateway.yaml:ro
    environment:
      # API keys — values read from your host environment or a .env file
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/rah-gateway", "-health", "-mport", "8081"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── RAH Studio (optional UI) ──────────────────────────────────────────────
  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    image: rah-studio:local
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/rah-studio"]
    command: ["-gateway-management-url", "http://gateway:8081", "-port", "8092"]
    ports:
      - "8092:8092"
    depends_on:
      - gateway
    profiles:
      - studio
