# ─── Tenant Routing Samples ───────────────────────────────────────────────────
#
# Three tenant identification patterns + one layered rate-limit variant.
#
#  Pattern 1 – From header:   X-Tenant-ID header → registry lookup → proxy
#  Pattern 2 – From query:    ?tenant_id= → registry lookup → proxy
#  Pattern 3 – From path:     /{alias}/data → registry lookup → proxy
#  Pattern 4 – With RL:       header ident + per-tenant RL + backend RL + proxy
#
# The registry maps tenant aliases to upstream URLs stored under key "primary".
# ─────────────────────────────────────────────────────────────────────────────

flows:

  # ── 1. Identify from X-Tenant-ID header ─────────────────────────────────
  - name: tenant_from_header
    action: upsert
    code: |
      registry.lookup(header("X-Tenant-ID"))
      upstream_url = registry.url("primary")
      resp = http.get(url_var: upstream_url, timeout: 5000)
      return(200, resp)

  # ── 2. Identify from ?tenant_id= query param ─────────────────────────────
  - name: tenant_from_query
    action: upsert
    code: |
      tenant_alias = query("tenant_id")
      registry.lookup(tenant_alias)
      upstream_url = registry.url("primary")
      resp = http.get(url_var: upstream_url, timeout: 5000)
      return(200, resp)

  # ── 3. Identify from {alias} path segment ───────────────────────────────
  - name: tenant_from_path
    action: upsert
    code: |
      tenant_alias = path("0")
      registry.lookup(tenant_alias)
      upstream_url = registry.url("primary")
      resp = http.get(url_var: upstream_url, timeout: 5000)
      return(200, resp)

  # ── 4. Layered rate limits: per-tenant + global ──────────────────────────
  - name: tenant_with_rate_limits
    action: upsert
    code: |
      registry.lookup(header("X-Tenant-ID"))
      rate_limit_v2(config: "rl-per-tenant", count_by: tenant)
      upstream_url = registry.url("primary")
      resp = http.get(url_var: upstream_url, timeout: 5000)
      return(200, resp)

# ─────────────────────────────────────────────────────────────────────────────
rate_limit_configs_v2:

  - name: rl-per-tenant
    enforcement: approximate
    windows:
      - period: 1m
        limit: 100
      - period: 1h
        limit: 1000

  - name: rl-overall
    enforcement: approximate
    windows:
      - period: 1m
        limit: 5000

# ─────────────────────────────────────────────────────────────────────────────
apis:

  # curl -H "X-Tenant-ID: acme" http://localhost:8080/samples/tenant/header
  - name: sample-tenant-header
    path: /samples/tenant/header
    method: GET
    flow_name: tenant_from_header
    action: upsert

  # curl "http://localhost:8080/samples/tenant/query?tenant_id=acme"
  - name: sample-tenant-query
    path: /samples/tenant/query
    method: GET
    flow_name: tenant_from_query
    action: upsert

  # curl http://localhost:8080/samples/tenant/acme/data
  - name: sample-tenant-path
    path: /samples/tenant/{alias}/data
    method: GET
    flow_name: tenant_from_path
    action: upsert

  # Layered rate limits: per-tenant (in flow) + global (on API)
  - name: sample-tenant-rl
    path: /samples/tenant/limited
    method: GET
    flow_name: tenant_with_rate_limits
    action: upsert
    rate_limit_policies:
      - kind: named
        config: rl-overall
        count_by: global
    skip_rate_limit: true    # per-tenant enforced in-flow
